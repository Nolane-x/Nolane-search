name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Check deployment scripts
        run: |
          node --check scripts/migrate.mjs
          node --check scripts/set-webhook.mjs
          node --check scripts/check-telegram-webhook.mjs
          node scripts/check-telegram-webhook.mjs
          node --check scripts/set-commands.mjs
          node --check scripts/check-telegram-mini-app.mjs
          bash -n scripts/install-siegfried.sh
          bash -n scripts/install-wave33-binaries.sh
      - name: Install pinned PRONOM engine for format identification tests
        run: bash scripts/install-siegfried.sh
      - name: Install Python tool test dependencies
        run: python -m pip install --disable-pip-version-check pillow pymupdf pyyaml openpyxl python-docx python-pptx 'qrcode[pil]' vobject fonttools dpkt jsonschema dnspython cryptography pdfplumber jmespath python-barcode rapidfuzz duckdb 'rdflib==7.6.0' 'pyshacl==0.40.2' 'croniter==7.0.0' 'trafilatura==2.3.1' 'mcap==1.6.0' 'pyiceberg==0.12.0' 'onnx==1.23.2' sqlglot sqlfluff bandit Pint trimesh ezdxf pyshp polib nbformat pillow-heif pyproj tinycss2 graphql-core h5py pydicom rio-cogeo==7.0.4
      - name: Test GitHub Actions tool runner
        run: |
          python -m py_compile tools/runner.py
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Test zero-cost self-hosted media node
        run: |
          python -m py_compile media-node/server.py
          python -m unittest discover -s media-node -p 'test_*.py'
      - name: Test media downloader service
        run: |
          python -m py_compile media-downloader/server.py
          python -m unittest discover -s media-downloader -p 'test_*.py'
      - name: Build media downloader container
        run: docker build --pull -t nolane-media-downloader:ci ./media-downloader
      - name: Verify private downloader container endpoint
        shell: bash
        run: |
          set -euo pipefail
          token="ci-internal-token-$(python -c 'import secrets; print(secrets.token_hex(32))')"
          docker run -d --name nolane-media-downloader-ci -e "NOLANE_INTERNAL_TOKEN=$token" -p 127.0.0.1:18080:8080 nolane-media-downloader:ci
          trap 'docker rm -f nolane-media-downloader-ci >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error -H "x-nolane-internal: $token" http://127.0.0.1:18080/health >/tmp/nolane-media-health.json; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          python -c 'import json; d=json.load(open("/tmp/nolane-media-health.json")); assert d["ok"] is True'
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/health)"
          test "$status" = "401"
      - name: Build Worker with default feature gates
        run: npx cf build
      - name: Build Worker with opt-in Container configuration
        env:
          MEDIA_DOWNLOADER_CONTAINER_ENABLED: "true"
        run: npx cf build