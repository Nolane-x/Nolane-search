name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Check deployment scripts
        run: |
          node --check scripts/migrate.mjs
          node --check scripts/set-webhook.mjs
          node --check scripts/check-telegram-webhook.mjs
          node scripts/check-telegram-webhook.mjs
          node --check scripts/set-commands.mjs
      - name: Install Python tool test dependencies
        run: python -m pip install --disable-pip-version-check pillow pymupdf pyyaml openpyxl python-docx python-pptx 'qrcode[pil]' vobject fonttools dpkt jsonschema dnspython cryptography sqlglot graphql-core croniter
      - name: Test GitHub Actions tool runner
        run: |
          python -m py_compile tools/runner.py
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Build Worker
        run: npx cf build