name: Nolane Tools Runner

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "D1-backed job created by the private Nolane Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nolane-tool-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOLANE_WORKER_URL: https://nolane-search.nolane-file.workers.dev
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch private job metadata (short-lived Worker secret scope)
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: python tools/runner.py fetch "$JOB_ID" "$RUNNER_TEMP/nolane-job.json"
      - name: Read selected tool
        id: job
        shell: bash
        run: |
          TOOL_ID="$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['job']['toolId'])" "$RUNNER_TEMP/nolane-job.json")"
          TOOL_IDS="$(python -c "import json,sys; j=json.load(open(sys.argv[1]))['job']; print(' '.join(s['toolId'] for s in j.get('pipeline',[{'toolId':j['toolId']}])))" "$RUNNER_TEMP/nolane-job.json")"
          SOURCE_TYPE="$(python -c "import json,sys; j=json.load(open(sys.argv[1]))['job']; print('github' if j.get('githubSource') else 'telegram')" "$RUNNER_TEMP/nolane-job.json")"
          echo "tool_id=$TOOL_ID" >> "$GITHUB_OUTPUT"
          echo "tool_ids=$TOOL_IDS" >> "$GITHUB_OUTPUT"
          echo "source_type=$SOURCE_TYPE" >> "$GITHUB_OUTPUT"
      - name: Download Telegram input (bot token scoped to download only)
        if: steps.job.outputs.source_type == 'telegram'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/runner.py download "$RUNNER_TEMP/nolane-job.json" "$RUNNER_TEMP/nolane-input-path.txt"
      - name: Download public GitHub repository snapshot
        if: steps.job.outputs.source_type == 'github'
        run: python tools/runner.py download "$RUNNER_TEMP/nolane-job.json" "$RUNNER_TEMP/nolane-input-path.txt"
      - name: Install base libraries
        run: python -m pip install --disable-pip-version-check pillow pymupdf
      - name: Install Office libraries
        if: contains(steps.job.outputs.tool_ids, 'office-text') || contains(steps.job.outputs.tool_ids, 'xlsx-profile') || contains(steps.job.outputs.tool_ids, 'csv-to-xlsx') || contains(steps.job.outputs.tool_ids, 'xlsx-to-csv') || contains(steps.job.outputs.tool_ids, 'xlsx-to-json') || contains(steps.job.outputs.tool_ids, 'docx-audit') || contains(steps.job.outputs.tool_ids, 'pptx-audit') || contains(steps.job.outputs.tool_ids, 'xlsx-privacy-audit') || contains(steps.job.outputs.tool_ids, 'docx-to-markdown') || contains(steps.job.outputs.tool_ids, 'pptx-notes-extract')
        run: python -m pip install --disable-pip-version-check python-docx openpyxl python-pptx
      - name: Install Vietnamese and English OCR engine
        if: contains(steps.job.outputs.tool_ids, 'image-ocr') || contains(steps.job.outputs.tool_ids, 'pdf-text')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
          python -m pip install --disable-pip-version-check pytesseract
      - name: Install PDF table extractor
        if: contains(steps.job.outputs.tool_ids, 'pdf-table-extract')
        run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Install JSON query engine
        if: contains(steps.job.outputs.tool_ids, 'json-jmespath-query')
        run: python -m pip install --disable-pip-version-check jmespath
      - name: Install barcode generator
        if: contains(steps.job.outputs.tool_ids, 'barcode-generate')
        run: python -m pip install --disable-pip-version-check python-barcode
      - name: Install fuzzy matching engine
        if: contains(steps.job.outputs.tool_ids, 'fuzzy-match-report')
        run: python -m pip install --disable-pip-version-check rapidfuzz
      - name: Install Parquet engine
        if: contains(steps.job.outputs.tool_ids, 'csv-to-parquet') || contains(steps.job.outputs.tool_ids, 'parquet-to-csv')
        run: python -m pip install --disable-pip-version-check duckdb
      - name: Install SQLGlot
        if: contains(steps.job.outputs.tool_ids, 'sqlglot-format')
        run: python -m pip install --disable-pip-version-check sqlglot
      - name: Install SQLFluff
        if: contains(steps.job.outputs.tool_ids, 'sqlfluff-lint')
        run: python -m pip install --disable-pip-version-check sqlfluff
      - name: Install Bandit Python scanner
        if: contains(steps.job.outputs.tool_ids, 'python-security-audit')
        run: python -m pip install --disable-pip-version-check bandit
      - name: Install Pint unit registry
        if: contains(steps.job.outputs.tool_ids, 'unit-convert')
        run: python -m pip install --disable-pip-version-check Pint
      - name: Install 3D mesh parser
        if: contains(steps.job.outputs.tool_ids, 'mesh-inspect')
        run: python -m pip install --disable-pip-version-check trimesh
      - name: Install DXF CAD parser
        if: contains(steps.job.outputs.tool_ids, 'dxf-audit')
        run: python -m pip install --disable-pip-version-check ezdxf
      - name: Install Shapefile parser
        if: contains(steps.job.outputs.tool_ids, 'shapefile-audit')
        run: python -m pip install --disable-pip-version-check pyshp
      - name: Install gettext parser
        if: contains(steps.job.outputs.tool_ids, 'gettext-catalog-audit')
        run: python -m pip install --disable-pip-version-check polib
      - name: Install Jupyter Notebook schema
        if: contains(steps.job.outputs.tool_ids, 'notebook-audit') || contains(steps.job.outputs.tool_ids, 'notebook-strip-outputs')
        run: python -m pip install --disable-pip-version-check nbformat
      - name: Install HEIC decoder
        if: contains(steps.job.outputs.tool_ids, 'heic-convert')
        run: python -m pip install --disable-pip-version-check pillow-heif
      - name: Install coordinate transformation library
        if: contains(steps.job.outputs.tool_ids, 'coordinate-transform')
        run: python -m pip install --disable-pip-version-check pyproj
      - name: Install CSS parser
        if: contains(steps.job.outputs.tool_ids, 'css-quality-audit')
        run: python -m pip install --disable-pip-version-check tinycss2
      - name: Install QR decoder
        if: contains(steps.job.outputs.tool_ids, 'qr-read')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzbar0
          python -m pip install --disable-pip-version-check pyzbar
      - name: Install FFmpeg
        if: contains(steps.job.outputs.tool_ids, 'audio-transcribe') || contains(steps.job.outputs.tool_ids, 'audio-subtitles') || contains(steps.job.outputs.tool_ids, 'audio-info') || contains(steps.job.outputs.tool_ids, 'video-info') || contains(steps.job.outputs.tool_ids, 'video-thumbnail') || contains(steps.job.outputs.tool_ids, 'audio-normalize') || contains(steps.job.outputs.tool_ids, 'video-audio') || contains(steps.job.outputs.tool_ids, 'video-gif') || contains(steps.job.outputs.tool_ids, 'video-contact-sheet') || contains(steps.job.outputs.tool_ids, 'video-compress') || contains(steps.job.outputs.tool_ids, 'audio-convert') || contains(steps.job.outputs.tool_ids, 'audio-silence-report') || contains(steps.job.outputs.tool_ids, 'video-silence-report') || contains(steps.job.outputs.tool_ids, 'video-frames') || contains(steps.job.outputs.tool_ids, 'audio-stereo-split') || contains(steps.job.outputs.tool_ids, 'audio-metadata-clean') || contains(steps.job.outputs.tool_ids, 'video-scene-frames') || contains(steps.job.outputs.tool_ids, 'video-metadata-clean') || contains(steps.job.outputs.tool_ids, 'audio-tag-audit')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Cache Whisper model files
        if: contains(steps.job.outputs.tool_ids, 'audio-transcribe') || contains(steps.job.outputs.tool_ids, 'audio-subtitles')
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: nolane-whisper-small-${{ runner.os }}-v1
      - name: Install Whisper
        if: contains(steps.job.outputs.tool_ids, 'audio-transcribe') || contains(steps.job.outputs.tool_ids, 'audio-subtitles')
        run: python -m pip install --disable-pip-version-check faster-whisper
      - name: Install YAML parser
        if: contains(steps.job.outputs.tool_ids, 'yaml-format') || contains(steps.job.outputs.tool_ids, 'code-check') || contains(steps.job.outputs.tool_ids, 'yaml-to-json') || contains(steps.job.outputs.tool_ids, 'json-to-yaml') || contains(steps.job.outputs.tool_ids, 'openapi-contract-audit')
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Install PCAP parser
        if: contains(steps.job.outputs.tool_ids, 'pcap-network-audit')
        run: python -m pip install --disable-pip-version-check dpkt
      - name: Install JSON Schema validator
        if: contains(steps.job.outputs.tool_ids, 'json-schema-validate')
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Install DNS zone parser
        if: contains(steps.job.outputs.tool_ids, 'dns-zone-audit')
        run: python -m pip install --disable-pip-version-check dnspython
      - name: Install X.509 certificate parser
        if: contains(steps.job.outputs.tool_ids, 'x509-certificate-audit') || contains(steps.job.outputs.tool_ids, 'ssh-public-key-audit')
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Install calendar and contact parsers
        if: contains(steps.job.outputs.tool_ids, 'ics-calendar-audit') || contains(steps.job.outputs.tool_ids, 'vcard-privacy-audit')
        run: python -m pip install --disable-pip-version-check vobject
      - name: Install font metadata parser
        if: contains(steps.job.outputs.tool_ids, 'font-inspect')
        run: python -m pip install --disable-pip-version-check fonttools
      - name: Install QR image generator
        if: contains(steps.job.outputs.tool_ids, 'qr-code-generate')
        run: python -m pip install --disable-pip-version-check 'qrcode[pil]'
      - name: Setup Node for JavaScript syntax checks
        if: contains(steps.job.outputs.tool_ids, 'code-check')
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Execute local processors
        if: ${{ !contains(steps.job.outputs.tool_ids, 'text-translate') }}
        run: python tools/runner.py run "$RUNNER_TEMP/nolane-job.json" "$RUNNER_TEMP/nolane-input-path.txt" "$RUNNER_TEMP/nolane-result.json"
      - name: Translate text through the configured Worker AI Router
        if: contains(steps.job.outputs.tool_ids, 'text-translate')
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: python tools/runner.py translate "$RUNNER_TEMP/nolane-job.json" "$RUNNER_TEMP/nolane-input-path.txt" "$RUNNER_TEMP/nolane-result.json"
      - name: Deliver output and update job (secrets are reintroduced after processing)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: python tools/runner.py complete "$JOB_ID" "$RUNNER_TEMP/nolane-result.json"
      - name: Report processing failure
        if: failure()
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: python tools/runner.py fail "$JOB_ID" --message "Tool runner failed. Open this GitHub Actions run for the diagnostic details." --result-file "$RUNNER_TEMP/nolane-result.json"
